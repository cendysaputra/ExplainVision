<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="346" viewBox="0 0 1142 346" role="img" aria-labelledby="title desc">
<title id="title">ExplainVision pipeline</title>
<desc id="desc">An input image is preprocessed and classified by a CNN into a top-k prediction. Target-layer activations and gradients from the CNN feed an explanation method, which produces a heatmap overlaid on the image.</desc>
<rect x="0" y="0" width="1142" height="346" fill="#ffffff"/>

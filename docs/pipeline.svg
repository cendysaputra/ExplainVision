<rect x="36.0" y="28.0" width="176.0" height="62.0" rx="8" ry="8" fill="#e7f0fb" stroke="#34506f" stroke-width="1.6"/>
<text x="124.0" y="59.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">Input image</text>
<line x1="212.0" y1="59.0" x2="252.0" y2="59.0" stroke="#243140" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="252.0" y="28.0" width="176.0" height="62.0" rx="8" ry="8" fill="#e7f0fb" stroke="#34506f" stroke-width="1.6"/>
<text x="340.0" y="59.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">Preprocess</text>
<line x1="428.0" y1="59.0" x2="468.0" y2="59.0" stroke="#243140" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="468.0" y="28.0" width="200.0" height="62.0" rx="8" ry="8" fill="#e7f0fb" stroke="#34506f" stroke-width="1.6"/>
<text x="568.0" y="59.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">CNN classifier</text>
<line x1="668.0" y1="59.0" x2="708.0" y2="59.0" stroke="#243140" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="708.0" y="28.0" width="214.0" height="62.0" rx="8" ry="8" fill="#e7f0fb" stroke="#34506f" stroke-width="1.6"/>
<text x="815.0" y="59.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">Prediction (top-k)</text>
<line x1="568.0" y1="90.0" x2="568.0" y2="130.0" stroke="#243140" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="448.0" y="130.0" width="240.0" height="86.0" rx="8" ry="8" fill="#f7f1e6" stroke="#6a5344" stroke-width="1.6"/>
<text x="568.0" y="160.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">CNN target-layer</text>
<text x="568.0" y="186.0" text-anchor="middle" dominant-baseline="middle" fill="#1b1f24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18">activations + gradients</text>
<line x1="568.0" y1="216.0" x2="568.0" y2="256.0" stroke="#243140" stroke-width="1.8" marker-end="url(#arrow)"/>
